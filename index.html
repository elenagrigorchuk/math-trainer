<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2E7D7A">
<title>Jednostki miar z Centkiem / Единицы измерения с Сантиком</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Retro: ciepły papier, grube kontury, twarde cienie (DESIGN.md, część 1). Bez ciemnego motywu. */
:root{
  --bg:#F1E7D0; --card:#FBF5E6; --ink:#2B2622; --muted:#6E655A; --line:#CDBF9F;
  --pri:#2E7D7A; --pri-ink:#FBF5E6; --pri-soft:#DCE9E3;
  --gold:#D9A23B; --brick:#B44F38;
  --ok:#9DB38F; --ok-bg:#D5E3CC; --bad:#B44F38; --bad-bg:#EFCFC6;
  --hl:#B44F38; --hl-bg:#F0D9A6;
  --bw:3px; --sh:4px 4px 0 var(--ink); --r:12px;
  --f-head:"Pixelify Sans",monospace; --f-body:"IBM Plex Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px dashed var(--brick);outline-offset:3px}
h1,h2{font-family:var(--f-head);font-weight:700;letter-spacing:.01em;word-spacing:.2em}
/* Pixelify Sans nie ma cyrylickich „О” i „П” — po rosyjsku nagłówki w IBM Plex Mono */
html[lang="ru"]{--f-head:"IBM Plex Mono",monospace}
html[lang="ru"] h1,html[lang="ru"] h2{letter-spacing:0;word-spacing:0}
/* liczby i jednostki zawsze w IBM Plex Mono (w Pixelify „5” wygląda jak „S”, „cm” jak „om”) */
.num-font{font-family:var(--f-body)}
.starrow,.starchip,.stars .big,.pill{font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",var(--f-body)}

/* header + language switch */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 16px 8px}
.brand h1{margin:0;font-size:1.5rem;line-height:1.15}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.lang{display:inline-flex;gap:6px;flex:none}
.lang button{width:44px;height:44px;padding:0;border:var(--bw) solid var(--ink);border-radius:10px;background:var(--card);font-weight:700;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.lang button.on{background:var(--pri);color:var(--pri-ink)}

/* mascot + speech bubble */
.say{display:flex;gap:12px;align-items:flex-start}
.say .mascot{flex:none}
.bubble{position:relative;background:var(--card);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:10px 14px;font-size:.98rem;box-shadow:var(--sh)}
.bubble:before{content:"";position:absolute;left:-9px;top:16px;width:14px;height:14px;background:var(--card);border-left:var(--bw) solid var(--ink);border-bottom:var(--bw) solid var(--ink);transform:rotate(45deg)}
.hello{padding:4px 16px 14px}

/* home */
.chips{padding:0 16px 14px;color:var(--muted);font-size:.9rem}
.stars{margin:0 16px 16px;padding:14px;background:var(--card);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.stars .rowt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.stars .big{font-weight:700;font-size:1.3rem}
.starrow{display:flex;gap:2px;font-size:1.35rem;line-height:1}
.starrow span{color:var(--line)}
.starrow .on{color:var(--gold);text-shadow:1px 1px 0 var(--ink)}
.stars .sub{color:var(--muted);font-size:.88rem}
.list{display:flex;flex-direction:column;gap:14px;padding:0 16px 8px;margin:0;list-style:none}
.topic{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.topic:active:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.topic:disabled{cursor:not-allowed;border-color:var(--line);box-shadow:none;color:var(--muted)}
.num{flex:none;width:40px;height:40px;border-radius:10px;border:var(--bw) solid var(--ink);display:grid;place-items:center;background:var(--hl-bg);color:var(--ink);font-weight:700;font-size:1.15rem}
.topic:disabled .num{border-color:var(--line);background:transparent;color:var(--muted)}
.topic.done .num{background:var(--ok);color:var(--ink)}
.topic .t{font-weight:700;font-size:1.08rem}
.topic .s{color:var(--muted);font-size:.85rem}
.learn-btn{display:block;width:100%;min-height:44px;margin-top:8px;padding:10px 14px;border:var(--bw) dashed var(--pri);border-radius:var(--r);background:var(--card);color:var(--pri);font-weight:700}
.foot{margin-top:auto;padding:16px;display:flex;gap:4px 16px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;min-height:44px;padding:4px 0;font-size:.88rem}

/* lesson */
.lbar{display:flex;align-items:center;gap:10px;padding:14px 16px}
.x{flex:none;width:44px;height:44px;border-radius:10px;border:var(--bw) solid var(--ink);background:var(--card);font-size:1.5rem;line-height:1;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.prog{flex:1;min-width:40px;height:16px;background:var(--card);border:var(--bw) solid var(--ink);border-radius:8px;overflow:hidden}
.fill{height:100%;background:var(--pri);transition:width .25s}
.starchip{flex:none;font-weight:700;color:var(--ink);background:var(--gold);border:var(--bw) solid var(--ink);border-radius:999px;padding:4px 12px;font-size:.92rem}
.qcard{flex:1;padding:24px 16px;display:flex;flex-direction:column;gap:20px}
.prompt{margin:0;color:var(--muted);font-size:.98rem}
.prompt.scene{color:var(--ink);font-size:1.05rem}
.expr{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:clamp(1.4rem,6.2vw,2rem);font-weight:700}
.expr .eq{color:var(--muted)}
.expr .u{font-weight:700}
.expr input{font:inherit;width:min(8ch,38vw);text-align:center;padding:4px 8px;border:var(--bw) solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--ink);outline:none}
.expr input:focus{border-color:var(--pri);box-shadow:3px 3px 0 var(--pri)}
.expr input.ok{border-color:var(--pri);box-shadow:3px 3px 0 var(--pri);background:var(--ok-bg)}
.expr input.bad{border-color:var(--brick);box-shadow:3px 3px 0 var(--brick);background:var(--bad-bg)}
.sentence{font-size:clamp(1.1rem,4.8vw,1.45rem);font-weight:600}
.sentence .blank{display:inline-block;min-width:3ch;border-bottom:var(--bw) solid var(--ink);text-align:center}
.err{margin:-8px 0 0;color:var(--brick);font-weight:600;font-size:.92rem}
.choices{display:grid;gap:12px}
.choices.two{grid-template-columns:1fr 1fr}
.choices.three{grid-template-columns:repeat(3,1fr)}
.choice{min-height:52px;padding:14px 10px;border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--card);font-size:1.1rem;font-weight:700;text-align:center;box-shadow:var(--sh)}
.choice:active:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.choice.sel{background:var(--pri);color:var(--pri-ink)}
.choice.right{background:var(--ok-bg);border-color:var(--ink)}
.choice.wrong{background:var(--bad-bg);border-color:var(--brick);box-shadow:4px 4px 0 var(--brick)}
.choice:disabled{cursor:default}
.actions{position:sticky;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:var(--card);border-top:var(--bw) solid var(--ink)}
.actions.ok{background:var(--ok-bg)}
.actions.bad{background:var(--bad-bg);border-top-color:var(--brick)}
.fbrow{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.fbrow .mascot{flex:none}
.fb .h{font-weight:700;font-size:1.08rem}
.actions.bad .h{color:var(--brick)}
.fb .d{margin-top:4px;font-size:.95rem}
.fb .rule{margin-top:6px;color:var(--muted);font-size:.88rem}
.pill{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:999px;background:var(--gold);border:2px solid var(--ink);color:var(--ink);font-weight:700}
.btn{display:block;width:100%;min-height:52px;padding:12px 14px;border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--pri);color:var(--pri-ink);font-weight:700;font-size:1.02rem;box-shadow:var(--sh)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{background:var(--line);color:var(--muted);border-color:var(--line);box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn2{margin-top:12px}

/* learn */
.learn{flex:1;padding:8px 16px 24px;display:flex;flex-direction:column;gap:18px}
.learn h2{margin:8px 0 0;font-size:1.5rem;line-height:1.2}
.lp{margin:0;font-size:1rem}
.callout{padding:14px;border-radius:var(--r);background:var(--hl-bg);border:var(--bw) solid var(--ink);box-shadow:var(--sh);font-weight:600;display:flex;flex-direction:column;gap:6px}
.anchors{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.anchors li{display:flex;gap:12px;align-items:center;background:var(--card);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:10px 12px;box-shadow:var(--sh)}
.chip{display:inline-block;min-width:3.2rem;text-align:center;padding:3px 9px;border-radius:8px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:700}
.chip.on{background:var(--pri);color:var(--pri-ink)}
.ex{display:flex;flex-direction:column;gap:12px}
.ex .row{background:var(--card);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:10px 14px;box-shadow:var(--sh)}
.ex .l{font-weight:700;font-size:1.05rem}
.ex .n{color:var(--muted);font-size:.88rem;margin-top:2px}
.zoom{background:var(--card);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh)}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.arr{color:var(--muted)}
.bar{display:flex;gap:3px}
.seg{flex:1;height:44px;border-radius:4px;background:#C98F4F;border:2px solid var(--ink);display:grid;place-items:center;font-size:.75rem;color:var(--card);font-weight:700}
.seg.first{background:var(--gold);color:var(--ink)}
.seg.one{font-size:1rem}
.facts{display:flex;flex-direction:column;gap:2px;font-weight:600;min-height:4.2em}
.cheat{background:var(--card);border:var(--bw) dashed var(--ink);border-radius:var(--r);padding:10px 12px;font-size:.9rem}
.cheat .cap{color:var(--muted);font-size:.82rem;margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.cheat .chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:8px}
.cheat .chip{min-width:0;padding:2px 6px}
.cheat .eqs{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-weight:600}
.solved{color:var(--pri);font-weight:700}
.chip.on .pre{color:inherit;background:none;text-decoration:underline}
.pre{color:var(--hl);background:var(--hl-bg);font-weight:700;border-radius:3px;padding:0 2px}
.q{font-size:1.1rem;font-weight:700}
.hintbox{padding:10px 14px;border-radius:var(--r);background:var(--bad-bg);border:var(--bw) solid var(--brick);color:var(--ink);font-size:.94rem}
.task{font-size:clamp(1.3rem,5.6vw,1.8rem);font-weight:700}

/* comic (DESIGN.md, część 2) */
.comic{gap:22px}
.chead h2{margin:4px 0 0;font-size:1.35rem;line-height:1.2}
.cpage{color:var(--muted);font-size:.85rem;font-weight:700;margin-top:2px}
.panel{position:relative;border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:14px;
  background-image:radial-gradient(rgba(43,38,34,.13) 1.3px,transparent 1.6px);background-size:9px 9px}
.panel.bg-a{background-color:#F6E2BF}.panel.bg-b{background-color:#E3EBD6}.panel.bg-c{background-color:#F4D9C9}.panel.bg-d{background-color:#DDEAE4}
.panel.card{background:var(--card);background-image:none}
.ccap{align-self:flex-start;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 0 -4px;padding:3px 10px;background:var(--gold);border:var(--bw) solid var(--ink);border-radius:8px;font-weight:700;font-size:.88rem;transform:rotate(-1deg)}
.ccap .pre{background:var(--card)}
.cstar{padding:0 8px;border-radius:999px;background:var(--card);border:2px solid var(--ink);font-family:"Segoe UI Symbol","DejaVu Sans",var(--f-body)}
.csay{display:flex;gap:12px;align-items:center}
.csay.r{flex-direction:row-reverse}
.csay .mascot,.heroes{flex:none}
.heroes{display:flex;gap:2px}
.cbubble{position:relative;flex:1;background:#FFFDF7;border:var(--bw) solid var(--ink);border-radius:16px;padding:10px 14px;font-weight:600;font-size:1rem}
.cbubble:before{content:"";position:absolute;left:-10px;top:50%;margin-top:-7px;width:14px;height:14px;background:#FFFDF7;border-left:var(--bw) solid var(--ink);border-bottom:var(--bw) solid var(--ink);transform:rotate(45deg)}
.csay.r .cbubble:before{left:auto;right:-10px;transform:rotate(225deg)}
.art{display:flex;flex-direction:column;gap:4px}
.choc{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;background:var(--ink);border:var(--bw) solid var(--ink);border-radius:6px;overflow:hidden}
.choc .pc{height:30px;background:#C98F4F;box-shadow:inset 3px 3px 0 #DDAA6E,inset -3px -3px 0 #A8733A}
.choc.fine .pc{height:44px;background:var(--gold);box-shadow:inset 3px 3px 0 #EEC46E,inset -3px -3px 0 #B9842A}
.choc.fine .pc.hi{background:#C98F4F;box-shadow:inset 3px 3px 0 #DDAA6E,inset -3px -3px 0 #A8733A}
.choc.mini{width:62%}.choc.mini .pc{height:16px;box-shadow:none}
.zoomarrow{width:calc(62% / 10 * 1 + 4px);min-width:max-content;font-weight:700;font-size:.85rem;color:var(--brick)}
.choc .pc.hi{background:var(--gold);box-shadow:inset 3px 3px 0 #EEC46E,inset -3px -3px 0 #B9842A}
.clabels{display:grid;grid-template-columns:repeat(10,1fr);font-weight:700;font-size:.85rem}
.clabels span{white-space:nowrap}
.span-label{text-align:center;font-weight:700;font-size:.9rem;border-top:2px solid var(--ink);padding-top:2px;margin:0 6px}
.span-label.top{border-top:0;border-bottom:2px solid var(--ink);padding:0 0 2px}
.grid100{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:min(100%,230px);margin:0 auto;background:var(--ink);border:var(--bw) solid var(--ink);border-radius:6px;overflow:hidden}
.grid100 div{aspect-ratio:1;background:#C98F4F}
.grid100 div.hi{background:var(--gold)}
.why{margin:0;font-size:1rem;font-weight:600}
.comic .choices .choice{font-size:1.05rem;padding:14px 4px}

/* result + game */
.result{flex:1;padding:24px 16px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.result h2{margin:0;font-size:1.7rem}
.result .score,.gwrap .score{font-size:3rem;font-weight:700;line-height:1}
.result p{margin:0;color:var(--muted)}
.result .gap{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:12px}
.gwrap{flex:1;padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px}
.gwrap h2{margin:0}
#gcanvas{width:100%;height:min(62vh,520px);border-radius:var(--r);border:var(--bw) solid var(--ink);box-shadow:var(--sh);touch-action:none;display:block;background:var(--bg)}
#gcanvas.pix{image-rendering:pixelated;height:auto;aspect-ratio:240/264;max-width:480px;margin:0 auto;background:#2B2622}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center;touch-action:none}
.dpad button{border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--card);font-size:1.3rem;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.dpad button:active{background:var(--pri);color:var(--pri-ink);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.gpick{display:flex;flex-direction:column;gap:14px;width:100%}
.gpick .btn small{display:block;font-weight:500;opacity:.9;margin-top:2px}
.gpick .btn:disabled small{opacity:1}
</style>
</head>

/* В русском тексте латинские обозначения единиц заменяются на русские (км, м, см…) */
const LU_MAP = { km: 'км', mm: 'мм', cm: 'см', dm: 'дм', mg: 'мг', kg: 'кг', dag: 'даг', ml: 'мл', m: 'м', g: 'г', t: 'т', l: 'л' };
function lu(str) {
  return S.lang === 'ru' ? str.replace(/(^|[^A-Za-z0-9_])(km|mm|cm|dm|mg|kg|dag|ml|m|g|t|l)(?![A-Za-z0-9_])/g, (x, a, b) => a + LU_MAP[b]) : str;

/* Приставки (кило, деци, санти, милли / kilo, decy, centy, mili) выделяются цветом */
const PRE_RE = /(кило|деци|санти(?!к)|милли|дека(?!бр|д)|kilo|decy|centy|mili|deka(?!d))/gi;
function textNodes(str) {
  str = lu(str).replace(/(\d) (?=[A-Za-zА-Яа-яµ²³]|\d{3}\b)/g, '$1\u00a0')
    .replace(/(\S) ([=·:]) (?=\d)/g, '$1\u00a0$2\u00a0')
    .replace(/(^|[\s«„(])([вкосуиаВКОСУИАwizoaWIZOA]) /g, '$1$2\u00a0');
  PRE_RE.lastIndex = 0;
  if (!PRE_RE.test(str)) return [str];
  return str.split(PRE_RE).map((part, i) => {
    if (i % 2 === 0) return part;
    const sp = document.createElement('span'); sp.className = 'pre'; sp.textContent = part; return sp;

const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = (arr) => arr[rnd(0, arr.length - 1)];
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const clean = (x) => parseFloat(Number(x).toPrecision(12));
function nice(x) {
  return isFinite(x) && x >= 0.001 && x <= 1e7 && Math.abs(x * 1000 - Math.round(x * 1000)) < 1e-6;
}
function fmt(n) {
  n = clean(n);
  let s = n.toFixed(3);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  let parts = s.split('.'), i = parts[0], d = parts[1];
  const neg = i.charAt(0) === '-';
  if (neg) i = i.slice(1);
  if (i.length >= 5) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? '-' : '') + i + (d ? ',' + d : '');
}
function parseNum(s) {
  s = String(s).replace(/[\s  ]/g, '').replace(',', '.');
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  return parseFloat(s);
}
function ymd(d) {
  const p = (n) => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function currentStreak() {

function el(tag, props) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (let i = 2; i < arguments.length; i++) {
    const kids = [].concat(arguments[i]);
    kids.forEach((c) => { if (c == null || c === false) return; if (typeof c === 'string') e.append(...textNodes(c)); else e.append(c); });
  }

}

/* ======================================================================
   Generatory zadań / Генераторы заданий
   ====================================================================== */
function genValue() {
  const n = pick([rnd(1, 9), rnd(1, 9), rnd(10, 99), rnd(2, 20) * 5, rnd(1, 9) + 0.5, rnd(1, 9) + 0.25]);
  const sc = pick([1, 1, 1, 10, 100, 0.1, 1000]);
  return parseFloat((n * sc).toPrecision(8));
}

function convertTask(topic, f0, t0, used) {
  const U = topic.units, keys = Object.keys(U);
  for (let i = 0; i < 3000; i++) {
    const f = f0 || pick(keys), t = t0 || pick(keys);
    if (f === t) continue;
    const r = U[f] / U[t];
    if (Math.max(r, 1 / r) > 1e6) continue;
    if (used && used.has(f + '>' + t) && i < 1500) continue;
    const v = genValue();
    const ans = clean(v * U[f] / U[t]);
    if (!nice(ans) || v > (topic.maxV || 1e5)) continue;
    return { type: 'convert', topic: topic.id, f, t, v, ans, retry: () => convertTask(topic, f, t) };
  }
  return convertTask(topic);
}

function sceneTask(topic, sc) {
  const U = topic.units, v = pick(sc.vals);
  return { type: 'convert', topic: topic.id, f: sc.f, t: sc.t, v, ans: clean(v * U[sc.f] / U[sc.t]), scene: sc,
           retry: () => convertTask(topic, sc.f, sc.t) };
}

function compareTask(topic, f0, t0) {
  const U = topic.units, keys = Object.keys(U);
  for (let i = 0; i < 3000; i++) {
    const f = f0 || pick(keys), t = t0 || pick(keys);
    if (f === t) continue;
    const r = U[f] / U[t];
    if (Math.max(r, 1 / r) > 1e6) continue;
    const v = genValue();
    const eq = clean(v * U[f] / U[t]);
    const mult = pick([1, 1, 0.9, 1.1, 0.8, 1.2, 0.5, 2, 1.5, 0.75]);
    const w = clean(eq * mult);
    if (!nice(eq) || !nice(w) || v > (topic.maxV || 1e5)) continue;
    const correct = mult === 1 ? 'eq' : (mult > 1 ? 'b' : 'a');
    const order = Math.random() < 0.5 ? ['a', 'b'] : ['b', 'a'];
    return { type: 'compare', topic: topic.id, f, t, v, eq, w, correct, order, retry: () => compareTask(topic, f, t) };
  }
  return compareTask(topic);
}

function compoundTask(topic, p) {
  p = p || pick(topic.compound);
  const big = p[0], small = p[1], k = p[2];
  const a = big === 'd' ? rnd(1, 6) : rnd(1, 9);
  let b;
  if (k >= 1000) b = rnd(1, 19) * 50;
  else if (k === 100) b = rnd(1, 19) * 5;
  else if (k === 60) b = rnd(1, 11) * 5;
  else b = rnd(1, k - 1);
  return { type: 'compound', topic: topic.id, big, small, k, a, b, ans: a * k + b, retry: () => compoundTask(topic, p) };
}

function unitTask(topic, item) {
  return {
    type: 'unit', topic: topic.id, item, opts: shuffle(item.opts), correct: item.ans,
    retry: () => unitTask(topic, pick(topic.items.filter((x) => x !== item)))
  };
}

function compose(topic) {
  const m = topic.mix, tasks = [], used = new Set();
  const scenes = shuffle(topic.scenes || []);
  for (let i = 0; i < m.convert; i++) {
    let t;
    if (i < (m.scene || 0) && scenes[i]) t = sceneTask(topic, scenes[i]);
    else t = convertTask(topic, null, null, used);
    used.add(t.f + '>' + t.t);
    tasks.push(t);
  }
  for (let i = 0; i < m.compound; i++) tasks.push(compoundTask(topic));
  for (let i = 0; i < m.compare; i++) tasks.push(compareTask(topic));
  shuffle(topic.items).slice(0, m.unit).forEach((it) => tasks.push(unitTask(topic, it)));
  return shuffle(tasks);
}

/* ======================================================================
   Wyświetlanie zadań / Отображение заданий
   ====================================================================== */
function isChoice(t) { return t.type === 'compare' || t.type === 'unit'; }

function choicesOf(t) {
  if (t.type === 'compare') {
    return t.order.map((id) => ({ id, text: id === 'a' ? fmt(t.v) + ' ' + ul(t.f) : fmt(t.w) + ' ' + ul(t.t) }))
      .concat([{ id: 'eq', text: tr('equal') }]);
  }
  return t.opts.map((u) => ({ id: u, text: ul(u) }));
}

function sceneText(t) {
  return t.scene[S.lang].replace('{q}', fmt(t.v) + ' ' + ul(t.f));
}

function ruleLines(t) {
  if (t.type === 'convert') {
    const U = TOPICS.find((x) => x.id === t.topic).units;
    const r = U[t.f] / U[t.t];
    let big, small, k;
    if (r >= 1) { big = t.f; small = t.t; k = r; } else { big = t.t; small = t.f; k = 1 / r; }
    k = clean(k);
    return [
      '1 ' + ul(big) + ' = ' + fmt(k) + ' ' + ul(small),
      fmt(t.v) + ' ' + ul(t.f) + ' = ' + fmt(t.v) + ' ' + (r >= 1 ? '·' : ':') + ' ' + fmt(k) + ' = ' + fmt(t.ans) + ' ' + ul(t.t)
    ];
  }
  if (t.type === 'compound') {
    return [
      '1 ' + ul(t.big) + ' = ' + fmt(t.k) + ' ' + ul(t.small),
      t.a + ' ' + ul(t.big) + ' ' + t.b + ' ' + ul(t.small) + ' = ' + t.a + ' · ' + fmt(t.k) + ' + ' + t.b + ' = ' + fmt(t.ans) + ' ' + ul(t.small)
    ];
  }
  if (t.type === 'compare') {
    const sign = t.eq > t.w ? '>' : (t.eq < t.w ? '<' : '=');
    return [
      fmt(t.v) + ' ' + ul(t.f) + ' = ' + fmt(t.eq) + ' ' + ul(t.t),
      fmt(t.eq) + ' ' + ul(t.t) + ' ' + sign + ' ' + fmt(t.w) + ' ' + ul(t.t)
    ];
  }
  return [];
}

function rightAnswerText(t) {
  if (t.type === 'convert') return fmt(t.ans) + ' ' + ul(t.t);
  if (t.type === 'compound') return fmt(t.ans) + ' ' + ul(t.small);
  if (t.type === 'compare') return choicesOf(t).find((c) => c.id === t.correct).text;
  return t.item.n + ' ' + ul(t.item.ans);
}

/* ======================================================================
   Przebieg lekcji / Ход урока (z gwiazdkami)
   ====================================================================== */
function startLesson(topic) {
  const q = compose(topic);
  V = { view: 'lesson', topic, lesson: { queue: q, cur: q.shift(), done: 0, first: 0, stars: 0, phase: 'answer', input: '', sel: null, err: false, ok: false, msgI: 0, starred: false } };
  render();
}

function doCheck() {
  const L = V.lesson, t = L.cur;
  if (L.phase !== 'answer') return;
  let ok;
  if (isChoice(t)) {
    if (!L.sel) return;
    ok = L.sel === t.correct;
  } else {
    const x = parseNum(L.input || '');
    if (x === null) { L.err = true; render(); return; }
    ok = Math.abs(x - t.ans) <= 1e-9 * Math.max(1, Math.abs(t.ans));
  }
  L.err = false; L.ok = ok; L.phase = 'feedback'; L.msgI = rnd(0, 4); L.starred = false;
  if (ok) {
    L.done++;
    if (!t.isRetry) { L.first++; L.stars++; L.starred = true; S.stars = (S.stars || 0) + 1; save(); }
  } else { const r = t.retry(); r.isRetry = true; L.queue.push(r); }
  render();
}

function doNext() {
  const L = V.lesson;
  if (L.phase !== 'feedback') return;
  if (!L.queue.length) return finishLesson();
  L.cur = L.queue.shift(); L.phase = 'answer'; L.input = ''; L.sel = null; L.err = false;
  render();
}

function finishLesson() {
  const topic = V.topic, L = V.lesson, idx = TOPICS.indexOf(topic);
  const prev = S.best[topic.id] || 0;
  S.best[topic.id] = Math.max(prev, L.first);
  const next = TOPICS[idx + 1];
  const newlyUnlocked = !!(next && prev < PASS && L.first >= PASS && !S.unlockAll);
  const now = new Date(), y = new Date();
  y.setDate(y.getDate() - 1);
  if (S.last !== ymd(now)) { S.streak = (S.last === ymd(y)) ? S.streak + 1 : 1; S.last = ymd(now); }
  save();
  V = { view: 'result', topic, score: L.first, earned: L.stars, next: newlyUnlocked ? next : null, passed: L.first >= PASS };
  render();
}

/* ======================================================================
   Tryb nauki / Режим обучения
   ====================================================================== */
function startLearn(topic) { V = { view: 'learn', topic, learn: { i: 0 } }; goStep(0); }

function goStep(n) {
  if (LEARN[V.topic.id].comic) return comicGo(n);
  const steps = LEARN[V.topic.id].steps;
  V.learn = { i: n, zoom: 0, wrongs: [], ok: false, stage: 0, input: '', err: false, msgI: 0 };
  if (steps[n].type === 'end') { S.learned = S.learned || {}; S.learned[V.topic.id] = true; save(); }
  render();
}

function guidedInfo(st) {
  const U = V.topic.units;
  const r = U[st.f] / U[st.t];
  let big, small, k;
  if (r >= 1) { big = st.f; small = st.t; k = r; } else { big = st.t; small = st.f; k = 1 / r; }
  k = clean(k);
  return { r, big, small, k, ans: clean(st.v * U[st.f] / U[st.t]) };
}

function stageDef(st, name) {
  const g = guidedInfo(st), L = S.lang;
  if (name === 'bigger') return {
    q: { pl: 'Która jednostka jest większa?', ru: 'Какая единица крупнее?' },
    opts: [st.f, st.t].map((u) => ({ id: u, text: ul(u) })), correct: g.big,
    solved: { pl: ul(g.big) + ' jest większa niż ' + ul(g.small), ru: ul(g.big) + ' крупнее, чем ' + ul(g.small) }
  };
  if (name === 'direction') return {
    q: { pl: 'Po zamianie liczba będzie…', ru: 'После перевода число будет…' },
    opts: [{ id: 'bigger', text: T[L].big }, { id: 'smaller', text: T[L].small }], correct: g.r >= 1 ? 'bigger' : 'smaller',
    solved: g.r >= 1 ? { pl: 'Liczba rośnie, więc mnożymy', ru: 'Число растёт — умножаем' } : { pl: 'Liczba maleje, więc dzielimy', ru: 'Число уменьшается — делим' }
  };
  if (name === 'factor') return {
    q: { pl: 'Ile ' + ul(g.small) + ' mieści się w 1 ' + ul(g.big) + '?', ru: 'Сколько ' + ul(g.small) + ' в 1 ' + ul(g.big) + '?' },
    opts: ['10', '100', '1000'].map((x) => ({ id: x, text: x })), correct: String(g.k),
    solved: { pl: '1 ' + ul(g.big) + ' = ' + fmt(g.k) + ' ' + ul(g.small), ru: '1 ' + ul(g.big) + ' = ' + fmt(g.k) + ' ' + ul(g.small) }
  };
  const line = fmt(st.v) + ' ' + ul(st.f) + ' = ' + fmt(g.ans) + ' ' + ul(st.t);
  return { q: null, correct: g.ans, solved: { pl: line, ru: line },
           expr: fmt(st.v) + ' ' + (g.r >= 1 ? '·' : ':') + ' ' + fmt(g.k) + ' = ' };
}

function learnPrimary() {
  if (LEARN[V.topic.id].comic) return comicPrimary();
  const Lr = V.learn, steps = LEARN[V.topic.id].steps, st = steps[Lr.i];
  if (st.type === 'info') return goStep(Lr.i + 1);
  if (st.type === 'check') { if (Lr.ok) goStep(Lr.i + 1); return; }
  if (st.type === 'guided') {
    if (Lr.stage >= st.stages.length) return goStep(Lr.i + 1);
    if (st.stages[Lr.stage] === 'answer') return guidedCheck(st);
    return;
  }
  if (st.type === 'end') startLesson(V.topic);
}

function guidedCheck(st) {
  const Lr = V.learn, def = stageDef(st, 'answer');
  const x = parseNum(Lr.input || '');
  if (x === null) { Lr.err = true; render(); return; }
  Lr.err = false;
  if (Math.abs(x - def.correct) <= 1e-9 * Math.max(1, Math.abs(def.correct))) { Lr.stage++; Lr.wrongs = []; Lr.input = ''; Lr.msgI = rnd(0, 4); }
  else Lr.wrongs = ['x'];
  render();
}

function cheatBlock() {
  const LT = LEARN[V.topic.id];
  const chain = el('div', { class: 'chain' });
  LT.chain.forEach((u, i) => {
    if (i) chain.append(el('span', { class: 'arr', 'aria-hidden': 'true' }, '→'));
    chain.append(el('span', { class: 'chip' }, ulNode(u)));

  return el('div', { class: 'cheat' }, el('div', { class: 'cap' }, tr('cheat')), chain,
    el('div', { class: 'eqs' }, LT.eqs.map((x) => el('div', null, x))));
}

function zoomBlock() {
  const Lr = V.learn, z = Lr.zoom, Z = LEARN[V.topic.id].zoom, lv = Z.levels;
  const crumbs = el('div', { class: 'crumbs' });

  const facts = Z.facts.slice(0, z);

function renderBlock(b) {
  const L = S.lang;
  if (b.t === 'p') return el('p', { class: 'lp' }, b[L]);
  if (b.t === 'rule') return el('div', { class: 'callout' }, b[L].map((x) => el('div', null, x)));
  if (b.t === 'anchors') return el('ul', { class: 'anchors' }, LEARN[V.topic.id].anchors.map((a) => el('li', null, el('span', { class: 'chip' }, ulNode(a[0])), el('span', null, a[1][L].replace(/(\d) /g, '$1\u00a0')))));
  if (b.t === 'ex') return el('div', { class: 'ex' }, b.rows.map((r) => el('div', { class: 'row' }, el('div', { class: 'l' }, r.line),
    el('div', { class: 'n' }, typeof r.note === 'string' ? r.note : r.note[L]))));
  if (b.t === 'zoom') return zoomBlock();

}

function optionButtons(opts, correct, wrongs, ok, onPick, cols) {
  const grid = el('div', { class: 'choices ' + cols });
  opts.forEach((o) => {
    let cls = 'choice';
    if (ok && o.id === correct) cls += ' right';
    else if (wrongs.indexOf(o.id) >= 0) cls += ' wrong';
    grid.append(el('button', { class: cls, disabled: ok, onclick: () => onPick(o.id) }, o.text));
  });
  return grid;
}

/* ======================================================================
   Gra „Czekoladopad” / Игра «Шоколадопад»  (kosztuje 10 gwiazdek)

function stopGame() {
  if (G) {
    cancelAnimationFrame(G.raf);
    window.removeEventListener('keydown', G.kd);
    window.removeEventListener('keyup', G.ku);
    G = null;
  }
}

function startGamePlay() {
  if ((S.stars || 0) < GAME_COST) return;
  S.stars -= GAME_COST; save();
  V.game = { phase: 'play', score: 0, kind: V.game.kind || 'catch' };
  render();
}

function bestKey(kind) { return kind === 'maze' ? 'mazeBest' : 'gameBest'; }
function endGame(score) {
  const kind = V.game.kind || 'catch', k = bestKey(kind);
  const record = score > (S[k] || 0);
  if (record) S[k] = score;
  save();
  stopGame();
  V.game = { phase: 'end', score, record, kind };
  render();
}
function openGames() { V = { view: 'game', game: { phase: 'menu' } }; render(); }

function drawCat(ctx, x, y, w) {
  const r = w * 0.42;
  ctx.fillStyle = '#F2A33A';
  ctx.beginPath(); ctx.moveTo(x - r * 0.95, y - r * 0.2); ctx.lineTo(x - r * 0.7, y - r * 1.3); ctx.lineTo(x - r * 0.1, y - r * 0.8); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + r * 0.95, y - r * 0.2); ctx.lineTo(x + r * 0.7, y - r * 1.3); ctx.lineTo(x + r * 0.1, y - r * 0.8); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#2E7D7A'; ctx.lineWidth = r * 0.22; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y - r * 0.05, r * 0.95, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.fillStyle = '#2B2622';
  ctx.beginPath(); ctx.ellipse(x - r * 0.36, y - r * 0.1, r * 0.1, r * 0.15, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + r * 0.36, y - r * 0.1, r * 0.1, r * 0.15, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#E8798B';
  ctx.beginPath(); ctx.moveTo(x - r * 0.1, y + r * 0.1); ctx.lineTo(x + r * 0.1, y + r * 0.1); ctx.lineTo(x, y + r * 0.24); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#2B2622'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(x, y + r * 0.2, r * 0.26, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
}

function runGame(cv) {
  const ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 320, H = cv.clientHeight || 480;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const catW = Math.min(88, W * 0.22), catY = H - catW * 0.55;
  const g = G = { x: W / 2, score: 0, t: GAME_SECS, items: [], spawn: 0.3, last: performance.now(), dir: 0, raf: 0 };
  const clampX = (x) => Math.max(catW / 2, Math.min(W - catW / 2, x));
  const setX = (cx) => { g.x = clampX(cx - cv.getBoundingClientRect().left); };
  cv.addEventListener('pointerdown', (e) => { setX(e.clientX); if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', (e) => setX(e.clientX));
  g.kd = (e) => { if (e.key === 'ArrowLeft') g.dir = -1; if (e.key === 'ArrowRight') g.dir = 1; };
  g.ku = (e) => { if ((e.key === 'ArrowLeft' && g.dir < 0) || (e.key === 'ArrowRight' && g.dir > 0)) g.dir = 0; };
  window.addEventListener('keydown', g.kd); window.addEventListener('keyup', g.ku);
  const INK = '#2B2622';
  function drawItem(it) {
    const x = it.x, y = it.y;
    ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
    if (it.kind === 'c') {                       // tabliczka czekolady / шоколадка
      ctx.fillStyle = '#C98F4F'; ctx.fillRect(x - 13, y - 17, 26, 34); ctx.strokeRect(x - 13, y - 17, 26, 34);
      ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.moveTo(x, y - 17); ctx.lineTo(x, y + 17);
      for (let k = -1; k <= 1; k++) { ctx.moveTo(x - 13, y + k * 8.5); ctx.lineTo(x + 13, y + k * 8.5); }
      ctx.stroke();
    } else if (it.kind === 's') {                // gwiazdka / звезда
      ctx.fillStyle = '#D9A23B'; ctx.beginPath();
      for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 7 : 16; ctx.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {                                     // brokuł / брокколи
      ctx.fillStyle = '#9DB38F'; ctx.fillRect(x - 5, y, 10, 15); ctx.strokeRect(x - 5, y, 10, 15);
      ctx.fillStyle = '#5E8F57';
      [[-8, -2, 9], [8, -2, 9], [0, -9, 10]].forEach((c) => { ctx.beginPath(); ctx.arc(x + c[0], y + c[1], c[2], 0, Math.PI * 2); ctx.fill(); ctx.stroke(); });
    }
  }

  function draw() {
    ctx.fillStyle = '#F1E7D0';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(43,38,34,.08)';
    for (let yy = 6; yy < H; yy += 12) for (let xx = (yy / 12) % 2 ? 12 : 6; xx < W; xx += 12) ctx.fillRect(xx, yy, 2, 2);
    g.items.forEach(drawItem);
    drawCat(ctx, g.x, catY, catW);
    ctx.textBaseline = 'middle';
    ctx.font = '700 18px "IBM Plex Mono",monospace';
    ctx.fillStyle = INK;
    ctx.textAlign = 'left'; ctx.fillText(String(g.score), 14, 22);
    ctx.textAlign = 'right'; ctx.fillText(String(Math.max(0, Math.ceil(g.t))) + (S.lang === 'ru' ? ' с' : ' s'), W - 14, 22);
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - g.last) / 1000); g.last = now; g.t -= dt;
    g.x = clampX(g.x + g.dir * 440 * dt);
    g.spawn -= dt;
    if (g.spawn <= 0) {
      const r = Math.random();
      g.items.push({ x: 20 + Math.random() * (W - 40), y: -20, kind: r < 0.6 ? 'c' : (r < 0.75 ? 's' : 'b'), vy: 150 + (GAME_SECS - g.t) * 3 + Math.random() * 60 });
      g.spawn = 0.5 + Math.random() * 0.4;
    }
    g.items.forEach((it) => { it.y += it.vy * dt; });
    g.items = g.items.filter((it) => {
      if (it.y > catY - catW * 0.5 && it.y < catY + catW * 0.3 && Math.abs(it.x - g.x) < catW / 2 + 8) {
        g.score = Math.max(0, g.score + (it.kind === 'c' ? 1 : (it.kind === 's' ? 3 : -2)));
        return false;
      }
      return it.y < H + 30;
    });
    draw();
    if (g.t > 0) g.raf = requestAnimationFrame(frame); else endGame(g.score);
  }
  draw();
  g.raf = requestAnimationFrame(frame);
}


/* ======================================================================
   Gra „Labirynt Centka” — pikselowy labirynt w stylu retro (kosztuje 10 gwiazdek)
   Własna plansza i własne postacie: Centek zbiera 🍫, unika brokułów, ⭐ = zjadaj brokuły.
   ====================================================================== */
const MAZE = [
  '###############',
  '#o.....#.....o#',
  '#.###.###.###.#',
  '#.............#',
  '#.###.#.#.###.#',
  '#.....#.#.....#',
  '#####.#.#.#####',
  '#.............#',
  '#####.#.#.#####',
  '#.....#.#.....#',
  '#.###.#.#.###.#',
  '#.............#',
  '#.###.###.###.#',
  '#o...........o#',
  '###############'
];
const SPR = {
  cat: ['O......O', 'OO....OO', 'OOOOOOOO', 'OEOOOOEO', 'OOOOPOOO', 'OOOOOOOO', '.OOOOOO.', '.BBBBBB.'],
  veg: ['..GGGG..', '.GGGGGG.', 'GGDGGDGG', 'GWKGWKGG', 'GGGGGGGG', '.SSSSSS.', '.S.SS.S.', 'SS....SS'],
  star: ['...YY...', '...YY...', 'YYYYYYYY', '.YYYYYY.', '..YYYY..', '..YY.YY.', '.YY...YY', '.Y.....Y']
};
const PAL = { O: '#F2A33A', E: '#2B2622', P: '#E8798B', B: '#2E7D7A', G: '#5E8F57', D: '#3E6A39', W: '#FBF5E6', K: '#2B2622', S: '#9DB38F', Y: '#D9A23B' };

function runMaze(cv) {
  const T = 16, N = 15, OY = 24, ctx = cv.getContext('2d');
  cv.width = N * T; cv.height = OY + N * T;
  ctx.imageSmoothingEnabled = false;
  const g = G = { raf: 0, last: performance.now(), t: 0, score: 0, lives: 3, level: 1, pause: 1.4, over: false,
                  want: { dx: 0, dy: 0 }, fright: 0, dots: [], left: 0, ghosts: [], p: null };
  const pass = (c, r) => c >= 0 && c < N && r >= 0 && r < N && MAZE[r][c] !== '#';
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  function buildDots() {
    g.dots = MAZE.map((row) => row.split('').map((ch) => (ch === '.' || ch === 'o') ? ch : ' '));
    g.dots[13][7] = ' ';
    g.left = g.dots.reduce((a, row) => a + row.filter((c) => c !== ' ').length, 0);
  }
  function resetActors() {
    g.p = { x: 7, y: 13, dx: 0, dy: 0 };
    g.want = { dx: 0, dy: 0 };
    const starts = [[3, 7], [11, 7], [7, 7], [7, 5]];
    const n = g.level >= 3 ? 4 : 3;
    g.ghosts = starts.slice(0, n).map((s, i) => ({ x: s[0], y: s[1], hx: s[0], hy: s[1], dx: 0, dy: 0, wait: 0.6 + i * 1.6, bias: [0.8, 0.55, 0.65, 0.7][i] }));
    g.fright = 0;
  }
  buildDots(); resetActors();

  function move(e, dist, pick) {
    for (let guard = 0; dist > 1e-6 && guard < 8; guard++) {
      const cx = Math.round(e.x), cy = Math.round(e.y);
      if (Math.abs(e.x - cx) < 1e-6 && Math.abs(e.y - cy) < 1e-6) {
        e.x = cx; e.y = cy; pick(e, cx, cy);
        if (!e.dx && !e.dy) return;
        if (!pass(cx + e.dx, cy + e.dy)) { e.dx = 0; e.dy = 0; return; }
      }
      let d;
      if (e.dx > 0) d = Math.ceil(e.x - 1e-6) - e.x; else if (e.dx < 0) d = e.x - Math.floor(e.x + 1e-6);
      else if (e.dy > 0) d = Math.ceil(e.y - 1e-6) - e.y; else d = e.y - Math.floor(e.y + 1e-6);
      if (d < 1e-6) d = 1;
      const s = Math.min(dist, d);
      e.x += e.dx * s; e.y += e.dy * s; dist -= s;
      if (Math.abs(s - d) < 1e-9) { e.x = Math.round(e.x); e.y = Math.round(e.y); }
    }
  }
  function eat(c, r) {
    const ch = g.dots[r][c];
    if (ch === ' ') return;
    g.dots[r][c] = ' '; g.left--;
    if (ch === 'o') { g.score += 5; g.fright = Math.max(3.5, 6.5 - 0.4 * g.level); } else g.score += 1;
  }
  function pPick(e, cx, cy) {
    eat(cx, cy);
    const w = g.want;
    if ((w.dx || w.dy) && pass(cx + w.dx, cy + w.dy)) { e.dx = w.dx; e.dy = w.dy; }
  }
  function gPick(e, cx, cy) {
    let opts = DIRS.filter((d) => pass(cx + d[0], cy + d[1]) && !(d[0] === -e.dx && d[1] === -e.dy));
    if (!opts.length) opts = DIRS.filter((d) => pass(cx + d[0], cy + d[1]));
    let d;
    if (g.fright <= 0 && Math.random() < e.bias) {
      let best = 1e9;
      opts.forEach((o) => { const dd = Math.abs(cx + o[0] - g.p.x) + Math.abs(cy + o[1] - g.p.y); if (dd < best) { best = dd; d = o; } });
    } else d = opts[rnd(0, opts.length - 1)];
    e.dx = d[0]; e.dy = d[1];
  }
  function loseLife() {
    g.lives--;
    if (g.lives <= 0) { g.over = true; g.pause = 1; return; }
    resetActors(); g.pause = 1.1;
  }

  function update(dt) {
    const pv = Math.min(6.2, 5 + 0.2 * g.level), gv = Math.min(5.6, 3.8 + 0.35 * g.level);
    g.fright = Math.max(0, g.fright - dt);
    const p = g.p, w = g.want;
    if ((w.dx || w.dy) && w.dx === -p.dx && w.dy === -p.dy) { p.dx = w.dx; p.dy = w.dy; }
    move(p, pv * dt, pPick);
    g.ghosts.forEach((e) => {
      if (e.wait > 0) { e.wait -= dt; return; }
      move(e, gv * (g.fright > 0 ? 0.6 : 1) * dt, gPick);
    });
    for (const e of g.ghosts) {
      if (e.wait > 0) continue;
      if (Math.abs(e.x - p.x) + Math.abs(e.y - p.y) < 0.8) {
        if (g.fright > 0) { g.score += 20; e.x = e.hx; e.y = e.hy; e.dx = e.dy = 0; e.wait = 3; }
        else { loseLife(); return; }
      }
    }
    if (g.left <= 0) { g.score += 50; g.level++; buildDots(); resetActors(); g.pause = 1.4; }
  }

  function spr(rows, x, y, pal) {
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const ch = rows[r][c]; if (ch === '.') continue;
      ctx.fillStyle = pal ? (pal[ch] || PAL[ch]) : PAL[ch];
      ctx.fillRect(Math.round(x) + c * 2, Math.round(y) + r * 2, 2, 2);
    }
  }
  function draw() {
    ctx.fillStyle = '#2B2622'; ctx.fillRect(0, 0, cv.width, cv.height);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const x = c * T, y = OY + r * T;
      if (MAZE[r][c] === '#') { ctx.fillStyle = '#2E7D7A'; ctx.fillRect(x, y, T, T); ctx.fillStyle = '#1F5553'; ctx.fillRect(x + 3, y + 3, T - 6, T - 6); }
      else if (g.dots[r][c] === '.') { ctx.fillStyle = '#C98F4F'; ctx.fillRect(x + 6, y + 6, 4, 4); ctx.fillStyle = '#E2B784'; ctx.fillRect(x + 6, y + 6, 2, 2); }
      else if (g.dots[r][c] === 'o' && Math.floor(g.t * 4) % 2 === 0) spr(SPR.star, x, y);
    }
    g.ghosts.forEach((e) => {
      const fr = g.fright > 0, flash = fr && g.fright < 2 && Math.floor(g.t * 6) % 2 === 0;
      const pal = fr ? { G: flash ? '#FBF5E6' : '#3F6D8F', D: flash ? '#CDBF9F' : '#2C4F68', S: flash ? '#F1E7D0' : '#8FAEC4' } : null;
      spr(SPR.veg, e.x * T, OY + e.y * T, pal);
    });
    spr(SPR.cat, g.p.x * T, OY + g.p.y * T);
    ctx.font = 'bold 12px monospace'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#FBF5E6'; ctx.textAlign = 'left'; ctx.fillText(String(g.score), 6, 12);
    ctx.textAlign = 'center'; ctx.fillStyle = '#D9A23B'; ctx.fillText(tr('mazeLevel')(g.level), cv.width / 2, 12);
    ctx.textAlign = 'right'; ctx.fillStyle = '#E8798B'; ctx.fillText('♥'.repeat(Math.max(0, g.lives)), cv.width - 6, 12);
    if (g.pause > 0 && !g.over) {
      ctx.fillStyle = 'rgba(43,38,34,.7)'; ctx.fillRect(0, OY + 6 * T, cv.width, 3 * T);
      ctx.fillStyle = '#D9A23B'; ctx.textAlign = 'center'; ctx.font = 'bold 16px "Pixelify Sans",monospace';
      ctx.fillText(tr('mazeLevel')(g.level), cv.width / 2, OY + 7.5 * T);
    }
  }
  const setW = (dx, dy) => { g.want.dx = dx; g.want.dy = dy; };
  g.setW = setW;
  g.kd = (e) => {
    const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] }[e.key];
    if (m) { e.preventDefault(); setW(m[0], m[1]); }
  };
  g.ku = () => {};
  window.addEventListener('keydown', g.kd);
  let sx = 0, sy = 0, down = false;
  cv.addEventListener('pointerdown', (e) => { down = true; sx = e.clientX; sy = e.clientY; if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', (e) => {
    if (!down) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 14) return;
    if (Math.abs(dx) > Math.abs(dy)) setW(dx > 0 ? 1 : -1, 0); else setW(0, dy > 0 ? 1 : -1);
    sx = e.clientX; sy = e.clientY;
  });
  cv.addEventListener('pointerup', () => { down = false; });

  function frame(now) {
    const dt = Math.min(0.05, (now - g.last) / 1000); g.last = now; g.t += dt;
    if (g.pause > 0) { g.pause -= dt; if (g.pause <= 0 && g.over) { endGame(g.score); return; } }
    else update(dt);
    draw();
    g.raf = requestAnimationFrame(frame);
  }
  draw();
  g.raf = requestAnimationFrame(frame);
}

      else if (c.id === L.sel) cls += ' sel';

        onclick: () => { L.sel = c.id; render(); }

    });

  let actions;
  if (!fb) {

    actions = el('footer', { class: 'actions' }, el('button', { id: 'checkBtn', class: 'btn', disabled, onclick: doCheck }, tr('check')));
  } else {

    actions = el('footer', { class: 'actions ' + (L.ok ? 'ok' : 'bad'), 'aria-live': 'polite' },
      el('div', { class: 'fbrow' },
        mascot(L.ok ? 'happy' : 'oops', 44),
        el('div', { class: 'fb' },
          el('div', { class: 'h' }, msg),
          L.starred && el('span', { class: 'pill' }, tr('gained')(1)),
          !L.ok && el('div', { class: 'd' }, tr('rightAnswer') + ' ', el('b', null, rightAnswerText(t))),
          rules.length > 0 && el('div', { class: 'rule' }, rules.map((r) => el('div', null, r))),
          !L.ok && el('div', { class: 'rule' }, tr('retryNote')))),
      el('button', { id: 'nextBtn', class: 'btn', onclick: doNext }, tr('next')));
  }
  return { nodes: [bar, card, actions], input };
}

/* ---------- Komiks / Комикс ---------- */
function comicGo(n) {
  const C = LEARN[V.topic.id].comic, prev = V.learn || {};
  V.learn = { i: n, sel: null, wrongs: [], tries: 0, starred: n > 0 ? !!prev.starred : false };
  if (C.pages[n].end) { S.learned = S.learned || {}; S.learned[V.topic.id] = true; save(); }
  render();
}
function comicTask(pg) { return (pg.panels || []).map((x) => x.task).find(Boolean); }
function comicCheck() {
  const Lr = V.learn, C = LEARN[V.topic.id].comic, task = comicTask(C.pages[Lr.i]);
  if (!task || !Lr.sel) return;
  Lr.tries++;
  if (Lr.sel === task.correct) {
    S.comicStars = S.comicStars || {};
    // +1 ★ tylko za dobrą odpowiedź za pierwszym razem i tylko raz na odcinek
    if (Lr.tries === 1 && !S.comicStars[C.id]) { S.comicStars[C.id] = true; S.stars = (S.stars || 0) + 1; save(); Lr.starred = true; }
    comicGo(Lr.i + 1);
  } else {
    // pierwsza pomyłka zamyka gwiazdkę za ten odcinek (także przy kolejnym podejściu)
    S.comicStars = S.comicStars || {};
    if (!S.comicStars[C.id]) { S.comicStars[C.id] = 'missed'; save(); }
    if (Lr.wrongs.indexOf(Lr.sel) < 0) Lr.wrongs.push(Lr.sel);
    Lr.sel = null; Lr.showHint = true; V.keepScroll = true; render();
  }
}
function comicPrimary() {
  const Lr = V.learn, pg = LEARN[V.topic.id].comic.pages[Lr.i];
  if (pg.end) return startLesson(V.topic);
  if (comicTask(pg)) return comicCheck();
  comicGo(Lr.i + 1);
}
function comicArt(kind) {
  const piece = (cls, txt) => el('div', { class: 'pc' + (cls ? ' ' + cls : '') }, txt || null);
  const row = (n, hi) => { const r = el('div', { class: 'choc' }); for (let i = 0; i < n; i++) r.append(piece(i === 0 && hi ? 'hi' : '')); return r; };
  const labels = (txt) => el('div', { class: 'clabels' }, el('span', null, txt));
  if (kind === 'bar') return el('div', { class: 'art' }, row(10, false), el('div', { class: 'span-label' }, '1 ' + ul('m')));
  if (kind === 'bar-dm') return el('div', { class: 'art' }, row(10, true), labels('1 ' + ul('dm')));
  if (kind === 'dm-cm') { const small = row(10, true); small.classList.add('mini');
    return el('div', { class: 'art' }, small, el('div', { class: 'zoomarrow', 'aria-hidden': 'true' }, '↓ 1 ' + ul('dm') + ' ↓'),
      el('div', { class: 'choc fine' }, Array.from({ length: 10 }, (_, i) => piece(i === 0 ? 'hi' : ''))), labels('1 ' + ul('cm'))); }
  if (kind === 'grid') { const g = el('div', { class: 'grid100', 'aria-hidden': 'true' }); for (let i = 0; i < 100; i++) g.append(el('div', { class: i === 0 ? 'hi' : '' })); return el('div', { class: 'art' }, g); }
  return null;
}
function comicPanel(pn, task) {
  const L = S.lang, Lr = V.learn;
  const panel = el('section', { class: 'panel bg-' + (pn.bg || 'a') + (pn.card ? ' card' : '') });
  if (pn.card) { panel.append(el('p', { class: 'why' }, pn.card[L])); return panel; }
  if (pn.cap) panel.append(el('div', { class: 'ccap' }, el('span', null, pn.cap[L]), pn.star && Lr.starred ? el('span', { class: 'cstar' }, '+1 ★') : null));
  const heroes = pn.hero === 'both' ? el('div', { class: 'heroes' }, mascot('happy', 64), brokko('happy', 64))
    : (pn.hero === 'broc' ? brokko(task ? 'calm' : 'happy', 68) : mascot('happy', 68));
  panel.append(el('div', { class: 'csay' + (pn.right ? ' r' : '') }, heroes, el('div', { class: 'cbubble' }, pn.say[L])));
  if (pn.art) panel.append(comicArt(pn.art));
  if (task) {
    panel.append(el('div', { class: 'choices three' }, task.opts.map((o) => {
      const wrong = Lr.wrongs.indexOf(o) >= 0;
      return el('button', { class: 'choice' + (Lr.sel === o ? ' sel' : '') + (wrong ? ' wrong' : ''), disabled: wrong, 'aria-pressed': Lr.sel === o ? 'true' : 'false',
        onclick: () => { Lr.sel = o; V.keepScroll = true; render(); } }, fmt(parseNum(o)));
    })));
    if (Lr.wrongs.length) panel.append(el('div', { class: 'hintbox', role: 'alert' }, tr('tryAgain') + '. ' + task.hint[L]));
  }
  return panel;
}
function renderComic() {
  const Lr = V.learn, LT = LEARN[V.topic.id], C = LT.comic, pg = C.pages[Lr.i], L = S.lang, N = C.pages.length;
  const bar = el('div', { class: 'lbar' },
    el('button', { class: 'x', 'aria-label': tr('close'), onclick: () => { V = { view: 'home' }; render(); } }, '×'),
    el('div', { class: 'prog', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(N), 'aria-valuenow': String(Lr.i + 1) },
      el('div', { class: 'fill', style: 'width:' + ((Lr.i + 1) / N * 100) + '%' })),
    el('span', { class: 'starchip', 'aria-label': tr('starsTitle') }, '★ ' + (S.stars || 0)),
    langToggle());
  const main = el('main', { class: 'learn comic' },
    el('header', { class: 'chead' }, el('h2', null, C.title[L]), el('div', { class: 'cpage' }, tr('pageOf')(Lr.i + 1, N))));
  let actions;
  if (pg.end) {
    main.append(el('section', { class: 'panel bg-c' }, el('div', { class: 'csay' }, mascot('happy', 60), el('div', { class: 'cbubble' }, tr('comicEnd'))), cheatBlock()));
    actions = el('footer', { class: 'actions' },
      el('button', { class: 'btn', onclick: () => startLesson(V.topic) }, tr('startPractice')),
      el('button', { class: 'btn ghost btn2', onclick: () => { V = { view: 'home' }; render(); } }, tr('toTopics')));
  } else {
    const task = comicTask(pg);
    pg.panels.forEach((pn) => main.append(comicPanel(pn, pn.task)));
    actions = el('footer', { class: 'actions' }, task
      ? el('button', { id: 'checkBtn', class: 'btn', disabled: !Lr.sel, onclick: comicCheck }, tr('check'))
      : el('button', { id: 'nextBtn', class: 'btn', onclick: () => comicGo(Lr.i + 1) }, tr('nextArrow')));
  }
  return { nodes: [bar, main, actions], input: null };
}

function renderLearn() {
  if (LEARN[V.topic.id].comic) return renderComic();
  const Lr = V.learn, steps = LEARN[V.topic.id].steps, st = steps[Lr.i], L = S.lang;
  const bar = el('div', { class: 'lbar' },
    el('button', { class: 'x', 'aria-label': tr('close'), onclick: () => { V = { view: 'home' }; render(); } }, '×'),
    el('div', { class: 'prog', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(steps.length - 1), 'aria-valuenow': String(Lr.i) },
      el('div', { class: 'fill', style: 'width:' + (Lr.i / (steps.length - 1) * 100) + '%' })),
    langToggle());
  const main = el('main', { class: 'learn' });
  let actions = null, input = null;
  const next = (label) => el('button', { id: 'nextBtn', class: 'btn', onclick: () => goStep(Lr.i + 1) }, label || tr('next'));
  const cheer = () => { const m = tr('okMsgs'); return m[Lr.msgI % m.length]; };

  if (st.type === 'info') {
    main.append(el('h2', null, st.title[L]), st.hi && say(st.hi[L], 'happy', 48), ...st.blocks.map(renderBlock));
    actions = el('footer', { class: 'actions' }, next());
  } else if (st.type === 'check') {
    main.append(el('div', { class: 'q' }, st.q[L]),
      optionButtons(st.opts.map((x) => ({ id: x, text: fmt(parseNum(x)) })), st.correct, Lr.wrongs, Lr.ok,
        (id) => { if (id === st.correct) { Lr.ok = true; Lr.msgI = rnd(0, 4); } else Lr.wrongs.push(id); render(); }, 'three'));
    if (Lr.wrongs.length && !Lr.ok) main.append(el('div', { class: 'hintbox', role: 'alert' }, tr('tryAgain') + '. ' + st.hint[L]));
    if (Lr.ok) actions = el('footer', { class: 'actions ok', 'aria-live': 'polite' },
      el('div', { class: 'fbrow' }, mascot('happy', 44), el('div', { class: 'fb' }, el('div', { class: 'h' }, cheer()), el('div', { class: 'd' }, st.why[L]))), next());
  } else if (st.type === 'guided') {
    main.append(el('h2', null, tr('together')), el('p', { class: 'lp' }, st.scene[L]),
      el('div', { class: 'task' }, fmt(st.v) + ' ' + ul(st.f) + ' = ? ' + ul(st.t)));
    for (let i = 0; i < Lr.stage; i++) main.append(el('div', { class: 'solved' }, '✓ ' + stageDef(st, st.stages[i]).solved[L]));
    if (Lr.stage < st.stages.length) {
      const name = st.stages[Lr.stage], def = stageDef(st, name);
      if (name === 'answer') {
        input = el('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false',
          'aria-label': tr('answerAria'), value: Lr.input || '',
          oninput: (e) => { Lr.input = e.target.value; const b = document.getElementById('checkBtn'); if (b) b.disabled = !Lr.input.trim(); } });
        main.append(el('div', { class: 'expr' }, el('span', null, def.expr), input, el('span', { class: 'u' }, ul(st.t))));
        if (Lr.err) main.append(el('p', { class: 'err', role: 'alert' }, tr('enterNumber')));
        actions = el('footer', { class: 'actions' }, el('button', { id: 'checkBtn', class: 'btn', disabled: !(Lr.input || '').trim(), onclick: () => guidedCheck(st) }, tr('check')));
      } else {
        main.append(el('div', { class: 'q' }, def.q[L]),
          optionButtons(def.opts, def.correct, Lr.wrongs, false,
            (id) => { if (id === def.correct) { Lr.stage++; Lr.wrongs = []; } else Lr.wrongs.push(id); render(); },
            def.opts.length === 3 ? 'three' : 'two'));
      }
      if (Lr.wrongs.length) main.append(el('div', { class: 'hintbox', role: 'alert' }, tr('tryAgain') + '. ' + ((LEARN[V.topic.id].hints || {})[name] || HINT[name])[L]));
      main.append(cheatBlock());
    } else {
      actions = el('footer', { class: 'actions ok', 'aria-live': 'polite' },
        el('div', { class: 'fbrow' }, mascot('happy', 44), el('div', { class: 'fb' }, el('div', { class: 'h' }, cheer()))), next());
    }
  } else {
    main.append(el('h2', null, st.title[L]), st.hi && say(st.hi[L], 'happy', 56), el('p', { class: 'lp' }, st.text[L]));
    actions = el('footer', { class: 'actions' },
      el('button', { class: 'btn', onclick: () => startLesson(V.topic) }, tr('startPractice')),
      el('button', { class: 'btn ghost btn2', onclick: () => { V = { view: 'home' }; render(); } }, tr('toTopics')));
  }
  return { nodes: [bar, main, actions], input };
}

function resultMessage(score) {
  const base = score === 10 ? tr('res10') : score >= 8 ? tr('res8') : score === 7 ? tr('res7') : score >= 4 ? tr('res4') : tr('res0');
  return (score === 6 || score === 7) ? base + ' ' + tr('meme67') : base;
}

function renderResult() {
  const tp = V.topic, have = S.stars || 0;
  const gap = el('div', { class: 'gap' },
    have >= GAME_COST && el('button', { class: 'btn', onclick: openGames }, tr('playGame')),
    el('button', { class: have >= GAME_COST ? 'btn ghost' : 'btn', onclick: () => { V = { view: 'home' }; render(); } }, tr('toTopics')),
    el('button', { class: 'btn ghost', onclick: () => startLesson(tp) }, tr('replay')));
  return el('main', { class: 'result' },
    say(resultMessage(V.score), V.score >= 7 ? 'happy' : 'oops', 56),
    el('h2', null, tr('done')),
    el('div', { class: 'score' }, V.score + '/' + LESSON_LEN),
    el('p', null, tr('firstTry')),
    el('p', { class: 'pill', style: 'color:var(--ink)' }, tr('gained')(V.earned) + ' · ★ ' + have),
    V.next ? el('p', null, tr('unlocked') + ' ', el('b', null, V.next.name[S.lang]))
      : (!V.passed && el('p', null, tr('needMore'))),
    gap);
}

function render() {
  const keepY = window.scrollY;
  stopGame();
  const app = document.getElementById('app');
  app.textContent = '';
  document.documentElement.lang = S.lang;
  let focusEl = null;
  if (V.view === 'home') renderHome().forEach((n) => app.append(n));
  else if (V.view === 'lesson') {
    const r = renderLesson();
    r.nodes.forEach((n) => app.append(n));
    focusEl = V.lesson.phase === 'answer' ? r.input : null;
  } else if (V.view === 'learn') {
    const r = renderLearn();
    r.nodes.forEach((n) => { if (n) app.append(n); });
    focusEl = r.input;
  } else if (V.view === 'game') {
    renderGame().forEach((n) => { if (n) app.append(n); });
  } else app.append(renderResult());
  if (V.keepScroll) { window.scrollTo(0, keepY); V.keepScroll = false; } else window.scrollTo(0, 0);
  if (V.view === 'learn' && V.learn && V.learn.showHint) { V.learn.showHint = false; const h = document.querySelector('.panel .hintbox'); if (h) h.scrollIntoView({ block: 'center' }); }
  if (focusEl) focusEl.focus();
  if (V.view === 'game' && V.game.phase === 'play') (V.game.kind === 'maze' ? runMaze : runGame)(document.getElementById('gcanvas'));
}

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (V.view === 'learn' && e.key === 'Enter') { e.preventDefault(); learnPrimary(); return; }
  if (V.view === 'game' && e.key === 'Enter' && V.game.phase === 'intro') { e.preventDefault(); startGamePlay(); return; }
  if (V.view !== 'lesson') return;
  const L = V.lesson;
  if (e.key === 'Enter') { e.preventDefault(); if (L.phase === 'answer') doCheck(); else doNext(); return; }
  if (L.phase === 'answer' && isChoice(L.cur) && /^[1-4]$/.test(e.key)) {
    const c = choicesOf(L.cur)[Number(e.key) - 1];
    if (c) { L.sel = c.id; render(); }
  }
});

render();
</script>
